<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f2ef" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='2' fill='%23C2410C'/%3E%3C/svg%3E" />
    <title>Statline</title>
    <!-- Latin font subsets from public/fonts (SIL OFL 1.1). Declared here, not in
         styles.css, because Bun's CSS bundler would inline them as base64. -->
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        src: url('/fonts/archivo-latin-wdth-normal.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter Variable';
        src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
        font-weight: 100 900;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/ibm-plex-mono-latin-600-normal.woff2') format('woff2');
        font-weight: 600;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
